name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy `tools` package, which the
          # cmdline-tools 16.0 on current runners no longer offers -- sdkmanager exits 1
          # and every job dies at setup. The NDK, CMake and platform are installed below.
          packages: platform-tools

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
