name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches app version
        run: |
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match app versionName $version"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not set. Refusing to publish an unsigned release."
            exit 1
          fi
          # Strip anything outside the base64 alphabet before decoding. A secret can
          # pick up a BOM, CR/LF, or console line-wrapping depending on how it was
          # uploaded (PowerShell pipes are a known offender); base64 -d rejects all of
          # it with a bare "invalid input". Whitelisting is robust to every variant.
          printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "Decoded keystore is empty. Re-check the RELEASE_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Verify keystore integrity and credentials
        env:
          EXPECTED_SHA256: 36bf9831cebba7e3a3989e8d57d79afd68a84113800c9d6f6f1e319cf432cc06
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          # The native build takes ~8 minutes before packageRelease would surface a bad
          # keystore or password. Fail here instead, in seconds, with a message that says
          # which of the two is actually wrong.
          actual=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d" " -f1)
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Decoded keystore does not match the expected file."
            echo "  expected $EXPECTED_SHA256"
            echo "  actual   $actual"
            echo "  RELEASE_KEYSTORE_BASE64 is corrupt or is a different keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore is intact, so RELEASE_KEYSTORE_PASSWORD or RELEASE_KEY_ALIAS is wrong."
            exit 1
          fi
          echo "Keystore matches and the password and alias open it."

      - name: Unit tests and release build
        env:
          LOCALSCRIBE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          LOCALSCRIBE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LOCALSCRIBE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LOCALSCRIBE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Verify the APK is release-signed
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=app/build/outputs/apk/release/app-release.apk
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed; it cannot be updated over. Failing the release."
            exit 1
          fi

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Generate checksum
        working-directory: app/build/outputs/apk/release
        run: sha256sum app-release.apk > app-release.apk.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          fail_on_unmatched_files: true
